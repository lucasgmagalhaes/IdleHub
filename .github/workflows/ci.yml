name: CI

on:
  push:
    branches: ["**"]
    # Documentation alone cannot break anything the pipeline checks.
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
    inputs:
      ios-bundle:
        description: Also try to build the full iOS app bundle (slow, exploratory)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TAURI_LINUX_DEPS: libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev

jobs:
  # Decides which platform jobs a push needs; all jobs then run in parallel.
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.filter.outputs.app }}
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app: &app
              - "crates/idlehub-core/**"
              - "crates/tauri-plugin-tabs/src/**"
              - "crates/tauri-plugin-tabs/*.toml"
              - "crates/tauri-plugin-tabs/build.rs"
              - "src-tauri/**"
              - "src/**"
              - "inject/**"
              - "index.html"
              - "vite.config.ts"
              - "tsconfig.json"
              - "package.json"
              - "pnpm-lock.yaml"
              - "Cargo.toml"
              - "Cargo.lock"
              - ".github/workflows/ci.yml"
            android:
              - *app
              - "crates/tauri-plugin-tabs/android/**"
            ios:
              - *app
              - "crates/tauri-plugin-tabs/ios/**"

  # Linux: lint, unit tests, the page runtime benchmark and the end-to-end app
  # benchmark share one job so system packages and the Rust build are set up once.
  linux:
    name: Linux tests & benchmarks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri system dependencies and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $TAURI_LINUX_DEPS xvfb
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:inject
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Cache Chromium for the benchmark
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium for the benchmark
        run: pnpm exec playwright install --with-deps chromium
      - name: Page runtime benchmark
        run: pnpm bench
      - name: Desktop end-to-end benchmark
        run: pnpm bench:app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-bench-results
          path: bench/results/

  # Building the app for the end-to-end benchmark also checks the Windows build.
  windows:
    name: Windows build & end-to-end benchmark
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm bench:app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-bench-results
          path: bench/results/

  macos:
    name: macOS build
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --debug --no-bundle

  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            src-tauri/gen/android/**/*.gradle*
            crates/tauri-plugin-tabs/android/*.gradle*
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android,aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Use the runner's NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Build APK
        run: pnpm tauri android build --debug --apk --target x86_64 --target aarch64
      - name: Plugin unit tests
        working-directory: src-tauri/gen/android
        run: ./gradlew :tauri-plugin-tabs:testDebugUnitTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Background execution tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: src-tauri/gen/android
          script: ./gradlew :tauri-plugin-tabs:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/
            src-tauri/gen/android/**/build/reports/

  ios:
    name: iOS
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build for the simulator (Rust and the Swift plugin)
        run: cargo build -p idlehub --target aarch64-apple-ios-sim
      - name: Plugin tests on the simulator
        working-directory: crates/tauri-plugin-tabs/ios
        run: |
          set -o pipefail
          xcodebuild test -scheme tauri-plugin-tabs -destination 'platform=iOS Simulator,name=iPhone 16' | tail -120
      - name: Build the app bundle (exploratory, on demand)
        if: github.event_name == 'workflow_dispatch' && inputs.ios-bundle
        continue-on-error: true
        run: |
          pnpm tauri ios init --ci
          pnpm tauri ios build --debug --target aarch64-sim
