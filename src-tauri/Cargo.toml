[package]
name = "idlehub"
version = "0.1.0"
description = "Multi-account browser for idle games"
edition.workspace = true
license.workspace = true

[lib]
name = "idlehub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
idlehub-core = { path = "../crates/idlehub-core" }
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Game webviews are created with wry directly on Windows to use WebView2 profiles.
[target.'cfg(windows)'.dependencies]
wry = "0.57"

# iOS does not let apps inspect processes, and sysinfo does not build there.
[target.'cfg(not(target_os = "ios"))'.dependencies]
sysinfo = "0.37"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-tabs = { path = "../crates/tauri-plugin-tabs" }
